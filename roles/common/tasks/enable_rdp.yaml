---
- name: Enable Remote Desktop
  ansible.windows.win_regedit:
    path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
    name: "fDenyTSConnections"
    data: 0

- name: Require Network Level Authentication (NLA) for Remote Desktop
  ansible.windows.win_regedit:
    path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    name: "UserAuthentication"
    data: 1

- name: Enable Remote Desktop firewall rule
  ansible.builtin.include_role:
    name: eingram23.windows.firewall
  vars:
    rule_name: "Remote Desktop"
    fw_port: 3389
    protocol: TCP
    profiles:
      - Domain

- name: Restart Remote Desktop service to apply changes
  ansible.windows.win_service:
    name: TermService
    state: restarted
    force_dependent_services: true

- name: Ensure server is listening on RDP port 3389
  ansible.windows.win_shell: |
    $port = 3389
    $tcpConnections = Get-NetTCPConnection -LocalPort $port -State Listen
    if ($tcpConnections.Count -eq 0) {
        Write-Error "Server is not listening on port $port"
        exit 1
    } else {
        Write-Output "Server is listening on port $port"
    }
  register: rdp_port_check
  ignore_errors: true

- name: Attempt to enable RDP via WMI if regedit method fails
  when: rdp_port_check.rc != 0
  ansible.windows.win_shell: |
    $tsSettings = Get-WmiObject -Class "Win32_TerminalServiceSetting" -Namespace root\cimv2\terminalservices
    $tsSettings.SetAllowTSConnections(1, 1)
  register: wmi_rdp_enable

- name: Ensure server is listening on RDP port 3389 (2nd check)
  when: wmi_rdp_enable is defined and wmi_rdp_enable.rc == 0
  ansible.windows.win_shell: |
    $port = 3389
    $tcpConnections = Get-NetTCPConnection -LocalPort $port -State Listen
    if ($tcpConnections.Count -eq 0) {
        Write-Error "Server is not listening on port $port"
        exit 1
    } else {
        Write-Output "Server is listening on port $port"
    }
