---
- name: Check if the host is already joined to the domain
  ansible.windows.win_shell: |
    $domain = "{{ domain }}"
    $computerDomain = (Get-WmiObject Win32_ComputerSystem).Domain
    if ($computerDomain -eq $domain) {
        Write-Output "Already joined to domain"
        exit 0
    } else {
        Write-Output "Not joined to domain"
        exit 1
    }
  register: check_domain_result
  ignore_errors: true

- name: Join to domain - {{ domain }}
  when: check_domain_result.rc != 0
  ansible.windows.win_shell: |
    Add-Computer -DomainName {{ domain }} `
    -Credential (New-Object System.Management.Automation.PSCredential("{{ domain }}\Admin", `
    (ConvertTo-SecureString "{{ lookup('hashi_vault', 'secret=secret/vsphere/vcsa:vsphere_password') }}" `
    -AsPlainText -Force)))
  register: join_domain_result

- name: Reboot after joining domain
  when: join_domain_result is defined and join_domain_result.rc == 0
  ansible.windows.win_reboot:
    msg: "Rebooting to complete domain join"
    pre_reboot_delay: 10
    reboot_timeout: 600
